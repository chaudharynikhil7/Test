<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DBR iOS Camera Test</title>

    <script src="https://cdn.jsdelivr.net/npm/dynamsoft-javascript-barcode@11.2.4000/dist/dbr.js"></script>

    <style>
      #cameraView {
        width: 100%;
        max-width: 640px;
        height: 480px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h3>Dynamsoft Barcode Reader – iOS Camera Test</h3>
    <div id="cameraView"></div>

    <script>
      (async () => {
        Dynamsoft.DBR.BarcodeReader.license =
          "DLS2eyJoYW5kc2hha2VDb2RlIjoiMTAwMTg0NTA5LVRYbFhaV0pRY205cSIsIm1haW5TZXJ2ZXJVUkwiOiJodHRwczovL21kbHMuZHluYW1zb2Z0b25saW5lLmNvbS8iLCJvcmdhbml6YXRpb25JRCI6IjEwMDE4NDUwOSIsInN0YW5kYnlTZXJ2ZXJVUkwiOiJodHRwczovL3NkbHMuZHluYW1zb2Z0b25saW5lLmNvbS8iLCJjaGVja0NvZGUiOjEzNDQxNjc1MDB9";

        const scanner = await Dynamsoft.DBR.BarcodeScanner.createInstance();

        const cameraEnhancer = await Dynamsoft.DCE.CameraEnhancer.createInstance();
        cameraEnhancer.setUIElement(document.getElementById("cameraView"));

        // Phase 1: language-agnostic hint so initial permission/open prefers back camera.
        await cameraEnhancer.updateVideoSettings({
          video: {
            facingMode: { ideal: "environment" },
          },
        });

        await scanner.setCameraEnhancer(cameraEnhancer);
        await scanner.open();

        // Phase 2: after permission, labels are more reliable on iOS. Refine selection.
        const cameras = await cameraEnhancer.getAllCameras();
        const currentCamera = await cameraEnhancer.getSelectedCamera();
        console.log("Available cameras:", cameras);
        console.log("Initially selected camera:", currentCamera);

        const normalizeLabel = (label) =>
          (label || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, " ")
            .trim();

        const WIDE_CAMERA_HINTS = [
          // English
          "wide",
          "ultra wide",
          "back",
          "rear",
          // French
          "grand angle",
          "ultra grand angle",
          "arriere",
          "camera arriere",
        ];

        const scoreCamera = (camera) => {
          const label = normalizeLabel(camera.label);
          let score = 0;

          if (camera.facingMode === "environment") score += 100;
          if (WIDE_CAMERA_HINTS.some((hint) => label.includes(hint))) score += 10;
          if (label.includes("front") || label.includes("avant")) score -= 100;

          return score;
        };

        const selectedCamera = cameras
          .map((camera) => ({ camera, score: scoreCamera(camera) }))
          .sort((a, b) => b.score - a.score)[0]?.camera;

        if (selectedCamera && selectedCamera.deviceId && selectedCamera.deviceId !== currentCamera?.deviceId) {
          console.log("Switching to preferred camera:", selectedCamera);
          await cameraEnhancer.selectCamera(selectedCamera.deviceId);
        }

        scanner.onFrameRead = (results) => {
          for (const r of results) {
            console.log("Frame read:", r.barcodeText);
          }
        };

        scanner.onUniqueRead = (txt) => {
          console.log("Unique barcode:", txt);
        };
      })();
    </script>
  </body>
</html>
