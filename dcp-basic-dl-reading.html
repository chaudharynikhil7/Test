<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCP Basic DL Reading</title>
    <script src="https://cdn.jsdelivr.net/npm/dynamsoft-barcode-reader-bundle@11.2.4000/dist/dbr.bundle.js"></script>
    <style>
      :root {
        --bg: #f4f6fb;
        --panel: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --accent-2: #0b5f57;
        --border: #d1d5db;
        --error: #b91c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top right, #e2f3f1, var(--bg) 45%);
        color: var(--ink);
      }

      .container {
        max-width: 1080px;
        margin: 24px auto;
        padding: 0 16px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .sub {
        margin: 0 0 14px;
        color: var(--muted);
      }

      textarea {
        width: 100%;
        min-height: 180px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        font-size: 14px;
        resize: vertical;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      button {
        border-radius: 9px;
        border: 1px solid var(--border);
        background: #fff;
        padding: 10px 12px;
        font-size: 14px;
      }

      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      button.primary:hover {
        background: var(--accent-2);
      }

      .status {
        margin-top: 10px;
        font-size: 14px;
      }

      .status.error {
        color: var(--error);
      }

      .split {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-top: 14px;
      }

      @media (min-width: 940px) {
        .split {
          grid-template-columns: 1fr 1fr;
        }
      }

      pre {
        margin: 0;
        background: #0b1020;
        color: #e2e8f0;
        padding: 12px;
        border-radius: 10px;
        overflow: auto;
        min-height: 220px;
        font-size: 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
        vertical-align: top;
        padding: 7px;
      }

      th {
        width: 36%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>DCP Basic DL Reading</h1>
        <p class="sub">
          Simple baseline page: parse text as-is, or scan with camera/image and parse directly. No normalization logic.
        </p>

        <textarea id="inputText" placeholder="Paste decoded barcode text here"></textarea>

        <div class="row">
          <button id="parseBtn" class="primary" type="button">Parse Text (As-Is)</button>
          <button id="scanBtn" type="button">Scan from camera or image</button>
        </div>

        <div id="status" class="status">Initializing SDK...</div>

        <div class="split">
          <div>
            <h3>Processed Result</h3>
            <table>
              <thead>
                <tr>
                  <th>Field</th>
                  <th>Value</th>
                </tr>
              </thead>
              <tbody id="resultBody"></tbody>
            </table>
          </div>
          <div>
            <h3>Parsed JSON</h3>
            <pre id="jsonOut">{}</pre>
          </div>
        </div>
      </div>
    </div>

    <script>
      const LICENSE =
        "DLS2eyJoYW5kc2hha2VDb2RlIjoiMTAwMTg0NTA5LU1UQXdNVGcwTlRBNUxYZGxZaTFVY21saGJGQnliMm8iLCJtYWluU2VydmVyVVJMIjoiaHR0cHM6Ly9tZGxzLmR5bmFtc29mdG9ubGluZS5jb20vIiwib3JnYW5pemF0aW9uSUQiOiIxMDAxODQ1MDkiLCJzdGFuZGJ5U2VydmVyVVJMIjoiaHR0cHM6Ly9zZGxzLmR5bmFtc29mdG9ubGluZS5jb20vIiwiY2hlY2tDb2RlIjozMDc3NTI2NjF9";

      const inputText = document.getElementById("inputText");
      const parseBtn = document.getElementById("parseBtn");
      const scanBtn = document.getElementById("scanBtn");
      const statusEl = document.getElementById("status");
      const resultBody = document.getElementById("resultBody");
      const jsonOut = document.getElementById("jsonOut");

      let parserPromise;

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.classList.toggle("error", isError);
      }

      function extractFields(parsedJson) {
        const out = [];

        function walk(node) {
          if (!node || typeof node !== "object") return;

          if (Array.isArray(node)) {
            node.forEach(walk);
            return;
          }

          if (node.FieldName && typeof node.Value === "string" && node.Value !== "") {
            if (!["subfile", "commonSubfile", "header"].includes(node.FieldName)) {
              out.push({ name: node.FieldName, value: node.Value });
            }
          }

          if (node.ChildFields) {
            walk(node.ChildFields);
          }
          if (node.ResultInfo) {
            walk(node.ResultInfo);
          }
        }

        walk(parsedJson && parsedJson.ResultInfo ? parsedJson.ResultInfo : parsedJson);

        const seen = new Set();
        return out.filter((item) => {
          const key = item.name + "__" + item.value;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function renderResult(fields, parsedJsonObj) {
        resultBody.innerHTML = "";
        if (!fields.length) {
          const row = document.createElement("tr");
          row.innerHTML = '<td colspan="2">No displayable fields.</td>';
          resultBody.appendChild(row);
        } else {
          fields.forEach((f) => {
            const row = document.createElement("tr");
            row.innerHTML = "<td>" + escapeHtml(f.name) + "</td><td>" + escapeHtml(f.value) + "</td>";
            resultBody.appendChild(row);
          });
        }

        jsonOut.textContent = JSON.stringify(parsedJsonObj, null, 2);
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      async function parseBytes(bytes, source) {
        try {
          setStatus("Parsing with DCP... source: " + source);
          const parser = await parserPromise;
          const parsed = await parser.parse(bytes);
          const parsedJsonObj = parsed && parsed.jsonString ? JSON.parse(parsed.jsonString) : {};
          const fields = extractFields(parsedJsonObj);

          renderResult(fields, {
            source,
            codeType: parsed.codeType || null,
            parserJson: parsedJsonObj,
          });
          setStatus("Parsed successfully. source: " + source);
        } catch (error) {
          setStatus("Parse failed: " + (error && error.message ? error.message : String(error)), true);
          renderResult([], { error: error && error.message ? error.message : String(error) });
        }
      }

      async function parseTextAsIs(rawText) {
        if (!rawText || !rawText.trim()) {
          setStatus("Please provide text first.", true);
          return;
        }

        const bytes = new TextEncoder().encode(rawText);
        await parseBytes(bytes, "text-as-is");
      }

      async function scanWithCameraOrImage() {
        try {
          setStatus("Opening camera scanner...");
          const scanner = new Dynamsoft.BarcodeScanner({
            license: LICENSE,
            showUploadImageButton: true,
            scannerViewConfig: {
              showFlashButton: true,
              showCloseButton: true,
              cameraSwitchControl: "toggleFrontBack",
            },
          });

          const result = await scanner.launch();
          const first = result && result.barcodeResults && result.barcodeResults[0];
          if (!first) {
            setStatus("No barcode result found from scanner.", true);
            return;
          }

          inputText.value = first.text || "";

          if (first.bytes && first.bytes.length) {
            await parseBytes(first.bytes, "scanner-bytes");
            return;
          }

          const fallbackBytes = new TextEncoder().encode(first.text || "");
          await parseBytes(fallbackBytes, "scanner-text-fallback");
        } catch (error) {
          setStatus("Camera/image scan failed: " + (error && error.message ? error.message : String(error)), true);
        }
      }

      async function init() {
        try {
          Dynamsoft.License.LicenseManager.initLicense(LICENSE);
          await Dynamsoft.DCP.CodeParserModule.loadSpec([
            "AAMVA_DL_ID",
            "AAMVA_DL_ID_WITH_MAG_STRIPE",
            "SOUTH_AFRICA_DL",
          ]);
          parserPromise = Dynamsoft.DCP.CodeParser.createInstance();
          setStatus("SDK ready. Paste text or scan.");
        } catch (error) {
          setStatus("SDK init failed: " + (error && error.message ? error.message : String(error)), true);
        }
      }

      parseBtn.addEventListener("click", async () => {
        await parseTextAsIs(inputText.value);
      });

      scanBtn.addEventListener("click", async () => {
        await scanWithCameraOrImage();
      });

      init();
    </script>
  </body>
</html>
