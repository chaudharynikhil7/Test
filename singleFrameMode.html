<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Single-frame barcode scanning with CameraView highlights using Dynamsoft Barcode Reader."
    />
    <meta name="keywords" content="barcode, single frame mode, camera view, highlight" />
    <link rel="canonical" href="https://demo.dynamsoft.com/Samples/DBR/JS/basics/hello-world.html" />
    <title>Dynamsoft Barcode Scanner Sample - Single Frame Mode with Highlight</title>

    <script src="https://cdn.jsdelivr.net/npm/dynamsoft-barcode-reader-bundle@11.4.3000/dist/dbr.bundle.js"></script>
  </head>

  <body>
    <h1 class="barcode-scanner-title">Hello World (snap image and identify barcode)</h1>
    <div class="barcode-scanner-view" style="width: 100%; height: 70vh"></div>
    <div class="result-view" style="width: 100%; height: calc(30vh - 80px); padding: 10px; overflow: auto"></div>

    <script>
      if (location.protocol === "file:") {
        const tip = document.createElement("div");
        tip.style.cssText =
          "background:#fff3cd;border:1px solid #ffc107;color:#856404;padding:12px 16px;margin:8px;border-radius:6px;font:14px/1.5 sans-serif;text-align:center;";
        tip.innerHTML =
          "<strong>Tip:</strong> This page works via <code>file://</code>, but for the best experience, " +
          "serve it from a web server (e.g. HTTPS or localhost).";
        document.body.insertBefore(tip, document.body.firstChild);
      }

      const resultView = document.querySelector(".result-view");

      function setDecodeStatus(message, color = "#333") {
        const status = document.createElement("div");
        status.style.cssText = `font-weight:600;margin-bottom:8px;color:${color};`;
        status.innerText = message;
        resultView.innerHTML = "";
        resultView.append(status);
      }

      function renderBarcodeItems(barcodeItems) {
        for (const item of barcodeItems) {
          const div = document.createElement("div");
          div.innerHTML = `format: ${item.formatString}<br> text: ${item.text} <br> ------------------`;
          resultView.append(div);
        }
      }

      Dynamsoft.License.LicenseManager.initLicense(
        "DLS2eyJoYW5kc2hha2VDb2RlIjoiMTAwMTg0NTA5LVRYbFhaV0pRY205cSIsIm1haW5TZXJ2ZXJVUkwiOiJodHRwczovL21kbHMuZHluYW1zb2Z0b25saW5lLmNvbS8iLCJvcmdhbml6YXRpb25JRCI6IjEwMDE4NDUwOSIsInN0YW5kYnlTZXJ2ZXJVUkwiOiJodHRwczovL3NkbHMuZHluYW1zb2Z0b25saW5lLmNvbS8iLCJjaGVja0NvZGUiOjEzNDQxNjc1MDB9",
      );

      (async () => {
        const cameraView = await Dynamsoft.DCE.CameraView.createInstance();
        const cameraEnhancer = await Dynamsoft.DCE.CameraEnhancer.createInstance(cameraView);
        const cvRouter = await Dynamsoft.CVR.CaptureVisionRouter.createInstance();

        cvRouter.setInput(cameraEnhancer);
        cameraEnhancer.singleFrameMode = "camera";

        // Create a dedicated layer for highlight overlays.
        const highlightLayer = cameraView.createDrawingLayer();
        const highlightStyleId = Dynamsoft.DCE.DrawingStyleManager.createDrawingStyle({
          fillStyle: "rgba(0, 255, 102, 0.15)",
          strokeStyle: "rgba(0, 255, 102, 1)",
          lineWidth: 3,
        });
        highlightLayer.setDefaultStyle(highlightStyleId);

        function drawBarcodeHighlights(barcodeItems) {
          highlightLayer.clearDrawingItems();
          if (!barcodeItems.length) return;

          const quadItems = barcodeItems
            .filter((item) => item.location)
            .map((item) => new Dynamsoft.DCE.QuadDrawingItem(item.location));

          if (quadItems.length) {
            highlightLayer.addDrawingItems(quadItems);
          }
        }

        cameraEnhancer.on("singleFrameAcquired", async (frameData) => {
          try {
            setDecodeStatus("Decoding captured frame...", "#6c757d");

            const capturedResult = await cvRouter.capture(frameData, "ReadBarcodes_ReadRateFirst");
            const barcodeItems = (capturedResult.items || []).filter(
              (item) => item.type === Dynamsoft.Core.EnumCapturedResultItemType.CRIT_BARCODE,
            );

            drawBarcodeHighlights(barcodeItems);

            if (!barcodeItems.length) {
              setDecodeStatus("No barcode decoded in this frame.", "#b26a00");
              return;
            }

            setDecodeStatus(`Decoded ${barcodeItems.length} barcode(s).`, "#1f7a1f");
            renderBarcodeItems(barcodeItems);
          } catch (err) {
            highlightLayer.clearDrawingItems();
            console.error("Capture failed:", err);
            setDecodeStatus(`Capture failed: ${err?.message || err}`, "#b00020");
          }
        });

        const uiElement = cameraView.getUIElement();
        document.querySelector(".barcode-scanner-view").append(uiElement);

        await cameraEnhancer.open();
      })();
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      .barcode-scanner-title {
        height: 80px;
        text-align: center;
        font-size: 20px;
        padding: 20px 0;
      }

      .barcode-scanner-view {
        width: 100%;
        height: calc(100% - 80px);
      }
    </style>
  </body>
</html>
