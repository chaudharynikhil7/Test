<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamsoft Barcode Scanner Sample - Hello World (Decode via Camera)</title>

    <!-- Include Dynamsoft Barcode Reader Bundle via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/dynamsoft-barcode-reader-bundle@11.4.2001/dist/dbr.bundle.js"></script>
    <!-- If the network is unstable or you prefer to self-host the SDK, uncomment the line below to load it locally -->
    <!-- <script src="../dist/dbr.bundle.js"></script> -->
  </head>

  <body>
    <h1 class="barcode-scanner-title">Hello World (Scan Barcode via Camera)</h1>
    <!-- This div will host the barcode scanner's camera view -->
    <div class="barcode-scanner-view" style="width: 100%; height: 60vh"></div>
    <div
      id="camera-debug"
      style="
        width: 100%;
        padding: 8px 10px;
        background: #f4f4f4;
        font-size: 13px;
        font-family: monospace;
        border-top: 1px solid #ddd;
        overflow: auto;
        max-height: 15vh;
      "
    >
      <strong>Camera debug:</strong> waiting...
    </div>
    <div class="result-view" style="width: 100%; height: calc(25vh - 80px); padding: 10px; overflow: auto"></div>
    <script>
      const resultView = document.querySelector(".result-view");

      const debugEl = document.getElementById("camera-debug");
      const debugLog = (msg) => {
        const line = document.createElement("div");
        line.textContent = msg;
        debugEl.append(line);
      };

      async function autoSelectPreferredCamera(cameraEnhancer) {
        // await cameraEnhancer.open();
        const access = await Dynamsoft.DCE.CameraEnhancer.testCameraAccess();
        debugEl.innerHTML = `<strong>Camera debug:</strong>`;
        debugLog(`testCameraAccess: ${access.ok ? "OK" : "DENIED – " + access.message}`);
        if (!access.ok) {
          throw new Error(access.message || "Camera access denied");
        }

        const cameras = await cameraEnhancer.getAllCameras();
        debugLog(`Available cameras (${cameras.length}):`);
        cameras.forEach((c, i) =>
          debugLog(
            `  [${i}] ${c.label || "(no label)"} | facingMode: ${c.facingMode || "unknown"} | id: ${c.deviceId?.slice(0, 8)}...`,
          ),
        );
        const current = await cameraEnhancer.getSelectedCamera();
        debugLog(`Current: ${current?.label || "(none)"}`);

        const norm = (s = "") =>
          s
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");

        const has = (camera, words) => {
          const l = norm(camera.label);
          return words.some((w) => l.includes(w));
        };

        const pick = (words) => cameras.find((c) => has(c, words));

        const target =
          pick(["ultra wide", "ultra grand angle"]) ||
          pick(["dual wide", "double grand angle"]) ||
          pick([" wide", "grand angle"]) ||
          cameras.find((c) => c.facingMode === "environment" || has(c, ["rear", "back", "arriere"])) ||
          cameras[0];

        debugLog(`Target: ${target?.label || "(none)"}`);

        if (target?.deviceId && target.deviceId !== current?.deviceId) {
          debugLog(`Switching to: ${target.label}`);
          await cameraEnhancer.selectCamera(target.deviceId);
        } else {
          debugLog("No switch needed – already on preferred camera.");
        }
      }

      Dynamsoft.License.LicenseManager.initLicense(
        "DLS2eyJoYW5kc2hha2VDb2RlIjoiMTAwMTg0NTA5LVRYbFhaV0pRY205cSIsIm1haW5TZXJ2ZXJVUkwiOiJodHRwczovL21kbHMuZHluYW1zb2Z0b25saW5lLmNvbS8iLCJvcmdhbml6YXRpb25JRCI6IjEwMDE4NDUwOSIsInN0YW5kYnlTZXJ2ZXJVUkwiOiJodHRwczovL3NkbHMuZHluYW1zb2Z0b25saW5lLmNvbS8iLCJjaGVja0NvZGUiOjEzNDQxNjc1MDB9",
      );

      (async () => {
        const cameraView = await Dynamsoft.DCE.CameraView.createInstance();
        const cameraEnhancer = await Dynamsoft.DCE.CameraEnhancer.createInstance(cameraView);
        const cvRouter = await Dynamsoft.CVR.CaptureVisionRouter.createInstance();

        await autoSelectPreferredCamera(cameraEnhancer);

        cvRouter.setInput(cameraEnhancer);

        const resultReceiver = new Dynamsoft.CVR.CapturedResultReceiver();
        resultReceiver.onDecodedBarcodesReceived = (result) => {
          console.log(result);
          resultView.innerHTML = "";
          for (let item of result.barcodeResultItems) {
            const div = document.createElement("div");
            div.innerHTML = `format: ${item.formatString}<br> text: ${item.text} <br> ------------------`;
            resultView.append(div);
          }
        };
        await cvRouter.addResultReceiver(resultReceiver);

        // Filter out unchecked and duplicate results.
        const filter = new Dynamsoft.Utility.MultiFrameResultCrossFilter();
        // Filter out unchecked barcodes.
        filter.enableResultCrossVerification("barcode", true);
        // Filter out duplicate barcodes within 3 seconds.
        filter.enableResultDeduplication("barcode", true);
        await cvRouter.addResultFilter(filter);

        const uiElement = cameraView.getUIElement();
        document.querySelector(".barcode-scanner-view").append(uiElement);

        await cameraEnhancer.open();
        await cvRouter.startCapturing("ReadBarcodes_SpeedFirst");
      })();
    </script>

    <!--
    Please note that putting CSS at the end is not a best practice. 
    We do this so that you can focus on reading the JS logic.
  -->
    <style>
      /* Reset default margin and padding, and apply border-box sizing */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Ensure html and body take full viewport size */
      html,
      body {
        width: 100%;
        height: 100%;
      }

      /* Style for the scanner title */
      .barcode-scanner-title {
        height: 80px;
        text-align: center;
        font-size: 20px;
        padding: 20px 0;
      }

      /* Container where the barcode scanner will be rendered */
      .barcode-scanner-view {
        width: 100%;
        height: calc(100% - 80px);
        /* Fill remaining space below the title */
      }
    </style>
  </body>
</html>
